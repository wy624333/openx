# Gradle 堆大小不再写死：gradlew 会按设备总内存的 50% 自动决定（钳制 1024MB~8GB，
# 15GB 设备 → 7612MB）。想手动指定，用设置页的「Gradle 堆内存上限」
# （写入 ~/.gradle/gradle.properties，那里一旦有值就以它为准，gradlew 不再插手）。
# 历史上这里写死过 -Xmx8g：在 4GB 设备上必然 OOM，在 15GB 设备上又和系统抢内存。
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=35

# aarch64 主机没有可用的原生 aapt2：系统版是 2.19（读不了 compileSdk 36 的新版资源表），
# build-tools 自带的是 x86-64 跑不动。改用 bt36/ 下的 qemu 包装版（2.20-15087165）。
android.aapt2FromMavenOverride=/root/toolchain/bt36/aapt2

# 本机容器内存紧张，Kotlin 编译 daemon 启动常被杀（回退进程内编译虽成功但报错噪音大、
# 每次构建耗时翻倍）。固定用进程内编译，结果稳定且只编译一次。
kotlin.compiler.execution.strategy=in-process
